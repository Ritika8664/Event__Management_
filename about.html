<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Categories</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f9f9f9;
        }
        
        .event-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .event-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            width: 250px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease-in-out;
        }
        
        .event-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        
        .event-card h3 {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        
        .event-card:hover {
            transform: scale(1.05);
        }
        
    </style>
</head>
<body>

    <div class="event-container">
        <div class="event-card">
            <img src="corporate.jpg" alt="Corporate Events">
            <h3>CORPORATE EVENTS</h3>
        </div>

        <div class="event-card">
            <img src="wedding.jpg" alt="Wedding Events">
            <h3>WEDDING EVENTS</h3>
        </div>

        <div class="event-card">
            <img src="celebrity.jpg" alt="Celebrity Management">
            <h3>CELEBRITY MANAGEMENT</h3>
        </div>

        <div class="event-card">
            <img src="pr.jpg" alt="PR Management">
            <h3>PR MANAGEMENT</h3>
        </div>
    </div>

</body>
</html>
